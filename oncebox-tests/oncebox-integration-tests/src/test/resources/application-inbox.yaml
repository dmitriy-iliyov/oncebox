spring:
  # Flyway and Liquibase are on the classpath for the schema group; these groups create the tables in DEV mode
  flyway:
    enabled: false
  liquibase:
    enabled: false
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: true
        format_sql: true
    hibernate:
      ddl-auto: none
logging:
  level:
    io.github.dmitriyiliyov.oncebox: DEBUG
oncebox:
  schema:
    mode: dev
  thread-pool-size: 2
  outbox:
    enabled: false
  inbox:
    enabled: true
    mappings:
      test-business-event: io.github.dmitriyiliyov.oncebox.tests.integration.domain.BusinessEvent
    cache:
      enabled: false
    metrics:
      enabled: true